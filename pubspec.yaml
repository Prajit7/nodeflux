name: nodeflux
description: A fast, widget-based node & flow editor for Flutter. Typed ports, animated edges, run status, undo/redo — built for workflow and AI-agent builders.
version: 0.1.0
homepage: https://nodeflux-demo.vercel.app
repository: https://github.com/Prajit7/nodeflux
topics: [node-editor, flow, workflow, graph, diagram]
screenshots:
  - description: Workflow editor with typed ports, run status and minimap.
    path: doc/screenshot.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

